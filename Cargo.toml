[workspace]
resolver = "3"
members = ["crates/binviz", "crates/binviz-wasm", "crates/binviz-cli", "crates/binviz-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trevor-e/binviz"
rust-version = "1.88"

[workspace.dependencies]
binviz = { path = "crates/binviz" }

object = { version = "0.40", default-features = false, features = ["read", "std", "compression", "names"] }
gimli = { version = "0.34", default-features = false, features = ["read", "std", "endian-reader"] }
addr2line = { version = "0.27", default-features = false, features = ["std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
yaxpeax-arch = { version = "0.3", default-features = false }
yaxpeax-arm = { version = "0.5", default-features = false }
rustc-demangle = "0.1"
cpp_demangle = { version = "0.5", default-features = false, features = ["std"] }
msvc-demangler = "0.11"
serde = { version = "1", features = ["derive"] }
memchr = "2"
flate2 = "1"
ruzstd = "0.9"
serde_json = "1"

wasm-bindgen = "=0.2.129"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Fast-enough debug builds for poking at large binaries from the CLI.
[profile.dev.package."*"]
opt-level = 2
